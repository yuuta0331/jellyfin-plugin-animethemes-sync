description: >
  Automatically download OP/ED videos from AnimeThemes.moe to upgrade your collection!

  Key Features:
  - Precise Matching: Uses AniList/MyAnimeList IDs to ensure the correct anime.
  - Smart Tagging: Automatically adds season tags like 'Winter 2024'.
  - Direct Links: Quick access to the source pages on AnimeThemes.moe.
